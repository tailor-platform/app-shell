name: Lint
description: Run linter and type-checker and test

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      with:
        run_install: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        cache: pnpm
        cache-dependency-path: ./pnpm-lock.yaml
        node-version-file: "./package.json"
    - name: Install dependencies
      run: pnpm install
      shell: bash
    - run: pnpm fmt:check
      shell: bash
    # `check-dts` type-checks the .d.ts we actually publish, from a packed
    # tarball with `skipLibCheck: false`. `type-check` cannot catch that: it
    # sets skipLibCheck: true and never looks at the emitted declarations.
    - run: pnpm exec turbo run lint test type-check check-dts
      shell: bash
    # Deterministic docs drift gate (no LLM). Runs uncached
    # so a docs/ change always re-validates the manifest and content index.
    - run: pnpm docs:check
      shell: bash
    - name: Smoke test bundled docs and repository skill discovery
      shell: bash
      run: |
        set -euo pipefail
        scratch=$(mktemp -d "${RUNNER_TEMP:-/tmp}/app-shell-docs.XXXXXX")
        scratch=$(cd "$scratch" && pwd -P)
        trap 'rm -rf "$scratch"' EXIT
        pnpm --filter @tailor-platform/app-shell pack --pack-destination "$scratch"
        tar -xzf "$scratch"/*.tgz -C "$scratch"

        # Only resolution is needed: use the real tarball without installing its dependencies.
        mkdir -p "$scratch/app/node_modules/@tailor-platform"
        package="$scratch/app/node_modules/@tailor-platform/app-shell"
        mv "$scratch/package" "$package"
        cp -R skills/app-shell-patterns "$scratch/skill"
        test ! -e "$package/skills"
        diff -r docs "$package/docs"

        index=$(node "$scratch/skill/scripts/discover-docs.mjs" "$scratch/app")
        test "$index" = "$package/docs/index.md"
        test "$(cd "$scratch/app" && node "$scratch/skill/scripts/discover-docs.mjs")" = "$index"
        node --input-type=module - "$index" <<'NODE'
        import assert from 'node:assert/strict';
        import { existsSync, readFileSync } from 'node:fs';
        import { dirname, resolve } from 'node:path';
        const index = process.argv[2];
        const content = readFileSync(index, 'utf8');
        assert(!content.includes('<!-- docs-index -->'), 'Index token was not expanded');
        const links = [...content.matchAll(/\]\(([^)\s]+)\)/g)];
        assert(links.length > 0, 'Documentation index has no links');
        for (const [, href] of links) {
          if (/^[a-z]+:/i.test(href)) continue;
          assert(existsSync(resolve(dirname(index), href.split('#')[0])), `Missing doc: ${href}`);
        }
        NODE

        if node "$scratch/skill/scripts/discover-docs.mjs" "$scratch" 2>"$scratch/error"; then
          echo 'Discovery should fail without an installed package' >&2
          exit 1
        fi
        grep -q 'Cannot resolve' "$scratch/error"
        rm "$index"
        if node "$scratch/skill/scripts/discover-docs.mjs" "$scratch/app" 2>"$scratch/error"; then
          echo 'Discovery should fail without bundled docs' >&2
          exit 1
        fi
        grep -q 'Bundled documentation is missing' "$scratch/error"
