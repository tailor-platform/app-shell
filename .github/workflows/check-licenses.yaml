name: Check Licenses

on:
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - ".github/license-package-exceptions.json"
      - ".github/workflows/check-licenses.yaml"
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - ".github/license-package-exceptions.json"
      - ".github/workflows/check-licenses.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
          node-version-file: "./package.json"

      - name: Install dependencies
        run: pnpm install

      # Chains must start with a non-published harness (vite-app, e2e), never
      # @tailor-platform/app-shell itself — package-exceptions may excuse a
      # license issue in a non-published app/test harness, never in the
      # published package.
      - name: Load and validate package exceptions
        id: package-exceptions
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const ALLOWED_ROOTS = ["e2e", "vite-app"];
          const configPath = ".github/license-package-exceptions.json";
          const config = JSON.parse(fs.readFileSync(configPath, "utf-8"));
          const violations = [];
          for (const [license, chains] of Object.entries(config)) {
            for (const chain of chains) {
              if (!ALLOWED_ROOTS.includes(chain[0])) {
                violations.push(
                  `"${license}": chain ${JSON.stringify(chain)} must start with one of ${ALLOWED_ROOTS.join(", ")}`,
                );
              }
            }
          }
          if (violations.length > 0) {
            console.error(`::error::Invalid ${configPath}:\n${violations.join("\n")}`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `exceptions=${JSON.stringify(config)}\n`);
          EOF

      - name: Check licenses
        uses: tailor-platform/actions/check-licenses@a3c3032e14277e81039eb26ae1a425adb22eb532 # v1.7.0
        with:
          license-groups: ${{ vars.CHECK_LICENSES_ALLOWED_LICENSE_GROUPS }}
          additional-licenses: ${{ vars.CHECK_LICENSES_ALLOWED_LICENSES }}
          denied-licenses: ${{ vars.CHECK_LICENSES_DENIED_LICENSES }}
          package-exceptions: ${{ steps.package-exceptions.outputs.exceptions }}
