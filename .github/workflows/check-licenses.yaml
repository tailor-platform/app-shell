name: Check Licenses

on:
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - ".github/license-package-exceptions.json"
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - ".github/license-package-exceptions.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
          node-version-file: "./package.json"

      - name: Install dependencies
        run: pnpm install

      # Chains must start with an example app (nextjs-app, vite-app), never
      # @tailor-platform/app-shell itself — package-exceptions may excuse a
      # license issue in a non-published example, never in the published
      # package.
      - name: Load and validate package exceptions
        id: package-exceptions
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const ALLOWED_ROOTS = ["nextjs-app", "vite-app"];
          const configPath = ".github/license-package-exceptions.json";
          const config = JSON.parse(fs.readFileSync(configPath, "utf-8"));
          const violations = [];
          for (const [license, chains] of Object.entries(config)) {
            for (const chain of chains) {
              if (!ALLOWED_ROOTS.includes(chain[0])) {
                violations.push(
                  `"${license}": chain ${JSON.stringify(chain)} must start with one of ${ALLOWED_ROOTS.join(", ")}`,
                );
              }
            }
          }
          if (violations.length > 0) {
            console.error(`::error::Invalid ${configPath}:\n${violations.join("\n")}`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `exceptions=${JSON.stringify(config)}\n`);
          EOF

      - name: Check licenses
        uses: tailor-platform/actions/check-licenses@v1
        with:
          license-groups: ${{ vars.LICENSE_GROUPS }}
          additional-licenses: ${{ vars.ALLOWED_LICENSES }}
          denied-licenses: ${{ vars.DENIED_LICENSES }}
          package-exceptions: ${{ steps.package-exceptions.outputs.exceptions }}
