name: Doc Check

on:
  pull_request:
    paths:
      - "docs/**/*.md"
      - "aqua.yaml"
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.65.2

      - name: Check links in docs
        run: |
          set -euo pipefail
          # tailor-inc/platform-planning is a private repo, so unauthenticated
          # lychee gets 404 on its issue links — exclude it (cannot be validated).
          find docs -type f -name '*.md' -print0 | xargs -0 lychee --no-progress --exclude 'mailto:' --exclude 'tailor-inc/platform-planning'
