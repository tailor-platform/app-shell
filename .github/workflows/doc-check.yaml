name: Doc Check

on:
  pull_request:
    paths:
      - "docs/**/*.md"
      - ".github/workflows/scripts/check-catalogue-links.sh"
      - "aqua.yaml"
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3

      - name: Check links in docs
        run: |
          set -euo pipefail
          find docs -type f -name '*.md' -print0 | xargs -0 lychee --no-progress --exclude 'mailto:'

      # lychee cannot validate UI Catalogue deep links: the catalogue is a
      # client-side-routed SPA, so an unknown /components/<slug> still answers
      # HTTP 200 and only renders "404 Not Found" after hydration.
      - name: Check UI Catalogue deep links
        run: ./.github/workflows/scripts/check-catalogue-links.sh
