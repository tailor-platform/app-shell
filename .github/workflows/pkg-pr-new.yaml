name: Release preview

on:
  pull_request:
    types: [labeled, synchronize]
    paths:
      - "packages/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
          node-version-file: "./package.json"
      - run: pnpm install
      - run: pnpm build
      # pkg.pr.new recommends executing from the lockfile instead of pnpm dlx in CI.
      # This repo also uses pnpm catalogs, so packing must go through pnpm rather than
      # npm's default pack implementation.
      - run: pnpm exec pkg-pr-new publish --pnpm "./packages/*" --commentWithSha --packageManager=pnpm # zizmor: ignore[use-trusted-publishing] pkg.pr.new preview releases do not upload to npm, so npm trusted publishing is not applicable here.
