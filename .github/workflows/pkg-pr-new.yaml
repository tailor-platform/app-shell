name: Release preview

on:
  pull_request:
    types: [labeled, synchronize]
    paths:
      - "packages/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish: # zizmor: ignore[use-trusted-publishing] pkg.pr.new preview releases do not upload to npm, so npm trusted publishing is not applicable here.
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
          node-version-file: "./package.json"
      - run: pnpm install
      - run: pnpm build
      # pkg.pr.new recommends executing from the lockfile instead of pnpm dlx in CI.
      # This repo also uses pnpm catalogs, so packing must go through pnpm rather than
      # npm's default pack implementation.
      - run: pnpm exec pkg-pr-new publish --pnpm "./packages/*" --commentWithSha --packageManager=pnpm
