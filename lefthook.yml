pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,md,mdx,yaml,yml,css,html}"
      # --no-error-on-unmatched-pattern: oxfmt has built-in ignore rules (lock files,
      # CHANGELOGs, etc.) that may exclude all staged files after lefthook's glob
      # matches them. Without this flag, oxfmt exits with code 2 when no files remain.
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    docs-check:
      # "Pre-commit warns, CI blocks." Runs only when docs sources / component
      # source / config change; never fails the commit (the `|| echo` keeps exit
      # 0) — `pnpm docs:check` in CI is the blocking gate.
      glob: "{docs-src/**,packages/core/src/**,docs.config.json,docs/**}"
      # Skipped silently when docs-kit hasn't been built (fresh clone/worktree),
      # so the warning always means real drift rather than a missing dist/.
      run: test -f packages/docs-kit/dist/cli.mjs && { pnpm docs:check || echo "⚠  docs/skill drift — run 'pnpm docs:sync' before pushing (CI blocks on this)"; } || true
