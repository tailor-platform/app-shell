packages:
  - docs-browser
  - e2e
  - examples/**
  - packages/**

catalog:
  "@tailor-platform/sdk": ^2.7.0
  "@tailwindcss/postcss": ^4.3.5
  "@types/node": ^25.9.8
  "@types/react": ^19
  "@types/react-dom": ^19
  "@vitejs/plugin-react": ^6.1.0
  lucide-react: 1.8.0
  oxfmt: ^0.47.0
  oxlint: 1.64.0
  react: ^19.2.7
  react-dom: ^19.2.7
  tailwindcss: ^4.3.5
  tsdown: ^0.22.14
  typescript: ^5.9.3
  vite: ^8.2.4
  vitest: ^4.1.12
  zod: ^4.6.7

# Supply-chain security settings.
# The following are enabled by default in pnpm@11 and intentionally omitted here:
#   - blockExoticSubdeps: true
#   - strictDepBuilds: true
#   - minimumReleaseAge: 1440 (1 day)
#   - verifyDepsBeforeRun: install

# Trust the lockfile so that already-resolved entries skip the minimumReleaseAge /
# trustPolicy verification pass. This prevents unrelated packages from failing
# trust checks when updating a specific dependency.
#
# Note: Since pnpm@11.4, tarball integrity mismatches are always a hard error
# regardless of this setting — a compromised or re-published tarball will still be
# caught at download time even with trustLockfile enabled. The only check skipped
# here is the time-based minimumReleaseAge / trustPolicy verification.
trustLockfile: true

# Require packages to be published for at least 3 days before allowing install (default: 1 day)
minimumReleaseAge: 4320
# First-party Tailor packages are exempt from the maturity gate: the gate guards
# against compromised third-party republishes, not packages we publish ourselves.
# Note: this matches on package name (glob), so it exempts all versions, not a
# specific one.
minimumReleaseAgeExclude:
  # First-party package exemption is intentional and permanent: this matches the
  # package name, so every version is exempt from the maturity gate.
  - "@tailor-platform/auth-public-client"
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # Renovate security update: next@16.3.3 || 16.3.8 || 16.4.1
  - next@16.3.3 || 16.3.8 || 16.4.1
  # Renovate security update: zod@4.6.6
  - zod@4.6.6
  # Renovate security update: happy-dom@21.0.4
  - happy-dom@21.0.4
  # Renovate security update: vite@7.3.8
  - vite@7.3.8

overrides:
  # API Extractor's TSDoc and Rushstack Ajv dependencies resolve the vulnerable
  # fast-uri@3.1.5. Pin the smallest patched version for GHSA-f65p-4m7j-42xc.
  ajv>fast-uri: 3.1.9
  # oxfmt pins vulnerable tinypool@2.1.0 (GHSA-85c8-ppgw-ccpr).
  oxfmt>tinypool: 2.1.2

# Deny all lifecycle scripts (postinstall, install, preinstall).
# pnpm resolves optionalDependencies correctly so these fallback scripts are unnecessary.
allowBuilds:
  esbuild: false
  "@swc/core": false
  sharp: false
  protobufjs: false
  msw: false
  "@tailor-platform/sdk": false
  "@prisma/engines": false
  # lefthook's postinstall installs git hooks; the root `prepare` script
  # handles that via `lefthook install` instead.
  lefthook: false

# Detect provenance or publisher trust downgrades in dependency updates
# Clean up unnecessary entries in updating/adding packages (trustPolicyExcludePrune)
trustPolicy: no-downgrade
trustPolicyExcludePrune: true
trustPolicyExclude:
  # semver@6.3.1 is a v6 backport published (2023/7/10) after 7.5.1+ which had provenance.
  # pnpm evaluates trust by publish date (not semver), so this triggers a false downgrade.
  # The semver maintainer states this is not a security concern.
  # See: https://github.com/npm/node-semver/issues/838
  - "semver@6.3.1"

# Save exact versions when adding dependencies
saveExact: true

# Enforce the Node version declared in package.json `engines` (24.x).
# Without this, pnpm only warns on Node < 24 and the install proceeds,
# leading to a cryptic build failure: tsdown's config loader needs Node 24's
# native TypeScript stripping and otherwise falls back to `unrun` (not a
# tsdown dependency). Fail fast at install time instead. See CONTRIBUTING.md.
engineStrict: true
